name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew
      - run: ./gradlew assembleRelease
      - run: keytool -genkey -v -keystore debug.keystore -alias opencode -keyalg RSA -keysize 2048 -validity 10000 -storepass opencode -keypass opencode -dname "CN=OpenCode" -noprompt
      - run: wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
      - run: java -jar uber-apk-signer-1.3.0.jar --apks app/build/outputs/apk/release/app-release-unsigned.apk --ks debug.keystore --ksAlias opencode --ksPass opencode --ksKeyPass opencode --overwrite
      - run: ls -la app/build/outputs/apk/release/
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-apk
          path: app/build/outputs/apk/release/*.apk
