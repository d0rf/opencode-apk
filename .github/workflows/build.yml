name: Build APK
on: push
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew
      - run: ./gradlew assembleRelease
      - name: Prepare keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > debug.keystore
            echo "Keystore repris du secret KEYSTORE_B64 : la signature reste stable d'un build à l'autre."
          else
            keytool -genkey -v -keystore debug.keystore -alias opencode -keyalg RSA -keysize 2048 -validity 10000 -storepass opencode -keypass opencode -dname "CN=OpenCode" -noprompt
            echo "::warning::Pas de secret KEYSTORE_B64 : keystore jetable regénéré, donc la signature change et il faut désinstaller l'APK précédent avant d'installer celui-ci."
          fi
      - run: wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
      - run: java -jar uber-apk-signer-1.3.0.jar --apks app/build/outputs/apk/release/app-release-unsigned.apk --ks debug.keystore --ksAlias opencode --ksPass opencode --ksKeyPass opencode --overwrite
      - run: ls -la app/build/outputs/apk/release/
      - name: Collect signed APK
        run: cp "$(ls app/build/outputs/apk/release/*.apk | head -1)" opencode.apk
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-apk
          path: opencode.apk
      - name: Publish APK to the rolling "latest" release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          APK signé, construit automatiquement depuis master (\`${GITHUB_SHA::7}\`).

          Téléchargement direct : https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/opencode.apk

          Si Android refuse l'installation par-dessus la version déjà présente, c'est que la signature a changé : désinstaller l'ancienne version d'abord. Définir le secret \`KEYSTORE_B64\` sur le dépôt rend la signature stable et supprime cette étape.
          EOF
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest opencode.apk --title "Dernier build" --notes-file notes.md
